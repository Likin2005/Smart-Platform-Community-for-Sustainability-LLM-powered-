<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoFriendly Leaderboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #000;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 40px;
      color: #00ff84;
      font-size: 2.2rem;
    }

    .leaderboard-container {
      margin-top: 40px;
      width: 80%;
      max-width: 800px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 10px rgba(0, 255, 132, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      text-align: center;
    }

    th {
      background-color: rgba(0, 255, 132, 0.2);
      color: #00ff84;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.05);
    }

    tr:hover {
      background-color: rgba(0, 255, 132, 0.1);
      transition: 0.3s;
    }

    .rank {
      font-weight: bold;
      color: #00ff84;
    }

    .reward {
      color: #ffd700;
      font-weight: bold;
    }

    .button-container {
      margin-top: 40px;
    }

    button {
      background-color: #00ff84;
      border: none;
      color: black;
      padding: 10px 25px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #00cc6d;
    }
  </style>
</head>

<body>
  <h1>🌿 EcoFriendly Leaderboard 🌿</h1>

  <div class="leaderboard-container">
    <table id="leaderboardTable">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Rewards</th>
        </tr>
      </thead>
      <tbody>
        <!-- Dynamic content will be added here by JS -->
      </tbody>
    </table>
  </div>

  <div class="button-container">
        <a class="back-btn" href="{{ url_for('index') }}">⬅ Back to Main</a>
  </div>

  <script>
    // Sample dynamic leaderboard data (could be fetched from a database)
    const leaderboardData = [
      { name: "Keerthan", rewards: 16 }
    ];

    // Sort leaderboard data by rewards (descending)
    leaderboardData.sort((a, b) => b.rewards - a.rewards);

    const tableBody = document.querySelector("#leaderboardTable tbody");

    leaderboardData.forEach((user, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="rank">#${index + 1}</td>
        <td>${user.name}</td>
        <td class="reward">${user.rewards} pts</td>
      `;
      tableBody.appendChild(row);
    });
  </script>
</body>
</html>
