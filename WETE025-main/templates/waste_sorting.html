<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Sorting Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .draggable {
      cursor: grab;
    }
    .dropzone {
      transition: background-color 0.3s;
    }
    .dropzone.dragover {
      background-color: #d1fae5;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold text-green-800 mb-4">♻️ Waste Sorting Challenge</h1>
  <p class="text-gray-700 mb-6 text-center max-w-md">
    Drag each waste item into the correct bin (Recycle ♻️, Compost 🌿, or Landfill 🗑️)!
  </p>

  <!-- Score -->
  <div class="flex items-center space-x-4 mb-6">
    <span class="text-lg font-semibold text-green-700">Score:</span>
    <span id="score" class="text-2xl font-bold text-green-800">0</span>
    <button id="resetBtn" class="ml-4 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Reset</button>
  </div>

  <!-- Waste Items -->
  <div id="itemsContainer" class="flex flex-wrap justify-center gap-4 mb-10">
    <!-- Items will be generated by JS -->
  </div>

  <!-- Bins -->
  <div class="flex justify-center gap-10">
    <div class="dropzone bg-green-200 w-40 h-40 rounded-xl flex flex-col items-center justify-center shadow-lg" data-type="recycle">
      <span class="text-2xl">♻️</span>
      <span class="font-semibold text-green-700">Recycle</span>
    </div>
    <div class="dropzone bg-yellow-200 w-40 h-40 rounded-xl flex flex-col items-center justify-center shadow-lg" data-type="compost">
      <span class="text-2xl">🌿</span>
      <span class="font-semibold text-yellow-700">Compost</span>
    </div>
    <div class="dropzone bg-gray-200 w-40 h-40 rounded-xl flex flex-col items-center justify-center shadow-lg" data-type="landfill">
      <span class="text-2xl">🗑️</span>
      <span class="font-semibold text-gray-700">Landfill</span>
    </div>
  </div>

  <script>
    const itemsData = [
      { name: "Plastic Bottle", type: "recycle" },
      { name: "Newspaper", type: "recycle" },
      { name: "Tin Can", type: "recycle" },
      { name: "Banana Peel", type: "compost" },
      { name: "Apple Core", type: "compost" },
      { name: "Tea Bag", type: "compost" },
      { name: "Used Tissue", type: "landfill" },
      { name: "Broken Glass", type: "landfill" },
      { name: "Styrofoam Cup", type: "landfill" },
      { name: "Cardboard Box", type: "recycle" },
      { name: "Eggshells", type: "compost" },
      { name: "Old Batteries", type: "landfill" }
    ];

    const itemsContainer = document.getElementById("itemsContainer");
    const dropzones = document.querySelectorAll(".dropzone");
    const scoreEl = document.getElementById("score");
    const resetBtn = document.getElementById("resetBtn");
    let score = 0;

    // Generate random 6 items per round
    function generateItems() {
      itemsContainer.innerHTML = "";
      const randomItems = [...itemsData].sort(() => Math.random() - 0.5).slice(0, 6);
      randomItems.forEach((item, i) => {
        const div = document.createElement("div");
        div.textContent = item.name;
        div.className = "draggable bg-white border border-gray-300 rounded-lg shadow px-4 py-2 text-center text-gray-800 font-medium";
        div.setAttribute("draggable", true);
        div.dataset.type = item.type;
        div.dataset.id = i;
        itemsContainer.appendChild(div);

        div.addEventListener("dragstart", e => {
          e.dataTransfer.setData("text/plain", JSON.stringify({ type: item.type, id: i }));
        });
      });
    }

    dropzones.forEach(zone => {
      zone.addEventListener("dragover", e => {
        e.preventDefault();
        zone.classList.add("dragover");
      });
      zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
      zone.addEventListener("drop", e => {
        e.preventDefault();
        zone.classList.remove("dragover");
        const data = JSON.parse(e.dataTransfer.getData("text/plain"));
        const correct = data.type === zone.dataset.type;
        if (correct) {
          score++;
          scoreEl.textContent = score;
          document.querySelector(`[data-id='${data.id}']`).remove();
        } else {
          alert("❌ Wrong bin! Try again.");
        }
      });
    });

    resetBtn.addEventListener("click", () => {
      score = 0;
      scoreEl.textContent = score;
      generateItems();
    });

    generateItems();
  </script>

</body>
</html>
